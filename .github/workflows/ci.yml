name: Cognilot CI — Monorepo

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PNPM_VERSION: 9

jobs:
  format:
    name: Check Code Formatting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prettier Check
        run: pnpm exec prettier --check .

  lint:
    name: Lint All Packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint SDK
        run: pnpm --filter @cognilot/sdk lint

      - name: Lint Extension
        run: pnpm --filter @cognilot/extension lint

      - name: Lint Web
        run: pnpm --filter @cognilot/web lint

      - name: Lint API
        run: pnpm --filter @cognilot/api lint

  typecheck:
    name: TypeScript Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build SDK first (required for extension types)
        run: pnpm --filter @cognilot/sdk build

      - name: Typecheck SDK
        run: pnpm --filter @cognilot/sdk exec tsc --noEmit

      - name: Typecheck API
        run: pnpm --filter @cognilot/api exec tsc --noEmit

      - name: Typecheck Web (Next.js)
        run: pnpm --filter @cognilot/web exec tsc --noEmit

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test SDK
        run: pnpm --filter @cognilot/sdk test

      - name: Test API
        run: pnpm --filter @cognilot/api test

      - name: Test Extension
        run: pnpm --filter @cognilot/extension test

      - name: Test Web
        run: pnpm --filter @cognilot/web test

  build:
    name: Build Check
    runs-on: ubuntu-latest
    needs: [format, lint, typecheck, test]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build SDK (required first — extension depends on it)
        run: pnpm --filter @cognilot/sdk build

      - name: Build Extension
        run: pnpm --filter @cognilot/extension build

      - name: Build Web (Next.js)
        run: pnpm --filter @cognilot/web build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder

      - name: Build API
        run: pnpm --filter @cognilot/api build
