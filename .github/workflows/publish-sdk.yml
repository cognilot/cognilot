name: Publish — Core SDK

on:
  push:
    tags:
      - 'sdk-v[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (do not actually publish)'
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

env:
  PNPM_VERSION: 9

jobs:
  publish-sdk:
    name: Build & Publish @cognilot/sdk
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@cognilot'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build SDK
        run: pnpm --filter @cognilot/sdk build

      - name: Publish to GitHub Packages
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            pnpm --filter @cognilot/sdk publish --no-git-checks --dry-run
          else
            pnpm --filter @cognilot/sdk publish --no-git-checks
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
