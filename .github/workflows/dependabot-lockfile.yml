name: Dependabot Lockfile Auto-Update

on:
  pull_request_target:
    types: [opened, synchronize]
    branches: [master]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-update-lockfile:
    name: Sync pnpm-lock.yaml
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Update pnpm-lock.yaml
        run: pnpm install --no-frozen-lockfile

      - name: Commit and push changes if lockfile updated
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet pnpm-lock.yaml; then
            git add pnpm-lock.yaml
            git commit -m "chore(deps): sync pnpm-lock.yaml"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          else
            echo "Lockfile is already up to date."
          fi
